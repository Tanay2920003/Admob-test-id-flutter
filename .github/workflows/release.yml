name: Android Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to publish (e.g. v1.0.0). Leave empty to only build."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admob_test_id
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - run: flutter build apk --release

      - run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            admob_test_id/build/app/outputs/flutter-apk/app-release.apk
            admob_test_id/build/app/outputs/bundle/release/app-release.aab

      - name: Publish GitHub Release
        if: inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          files: |
            admob_test_id/build/app/outputs/flutter-apk/app-release.apk
            admob_test_id/build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: true
